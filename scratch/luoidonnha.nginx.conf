map $http_referer $api_backend_port {
    default 3000;
    ~*omniroute 20128;
    ~*dashboard 20128;
    ~*providers 20128;
    ~*endpoints 20128;
    ~*api-keys 20128;
    ~*combos 20128;
    ~*quota 20128;
    ~*caveman 20128;
    ~*omnichannel 20128;
    ~*openclaw 20180;
}

server {
    listen 80;
    server_name luoidonnha.com www.luoidonnha.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name luoidonnha.com www.luoidonnha.com;

    ssl_certificate /etc/letsencrypt/live/luoidonnha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luoidonnha.com/privkey.pem;

    # Block common vulnerability scanners & WordPress probes instantly (save CPU)
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|bak|sql)$ {
        return 444;
    }
    location ~* /(xmlrpc\.php|wp-admin|wp-login|wp-content|phpmyadmin|adminer|eval-stdin) {
        return 444;
    }

    # OmniRoute App Gateway Proxy
    location /omniroute-app/ {
        proxy_pass http://127.0.0.1:20128/;
        proxy_redirect / /omniroute-app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # OpenClaw App Gateway Proxy
    location /openclaw-app/ {
        proxy_pass http://127.0.0.1:20180/;
        proxy_redirect / /openclaw-app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # OmniRoute API v1 Gateway Proxy
    location /v1/ {
        proxy_pass http://127.0.0.1:20128/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Explicit OmniRoute API Endpoints Mapping
    location ~ ^/api/(keys|providers|combos|quota|settings|discovery|connections|stats|logs|mcp|version|cli-tools) {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OmniRoute & OpenClaw Dynamic API Routing
    location /api/ {
        proxy_pass http://127.0.0.1:$api_backend_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OmniRoute Dashboard Sub-routes Proxy
    location ~ ^/(dashboard|home|providers|endpoints|api-keys|combos|quota|caveman|rtk|cli-tools|agents|cloud-agents|api-endpoints|webhooks|proxy|mitm-proxy) {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Route static media font files (.woff2, .ttf, .woff) to OmniRoute
    location /_next/static/media/ {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route _next static assets based on Referer header so embedded sub-apps get their exact JS chunks
    location /_next/ {
        if ($http_referer ~* "(omniroute|home|dashboard|providers|endpoints|api-keys|combos|quota|caveman|rtk|cli-tools|agents|cloud-agents|api-endpoints|webhooks|proxy|mitm-proxy|omnichannel)") {
            proxy_pass http://127.0.0.1:20128;
            break;
        }
        if ($http_referer ~* "openclaw") {
            proxy_pass http://127.0.0.1:20180;
            break;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Default Next.js App Proxy (Luoi CMS)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
