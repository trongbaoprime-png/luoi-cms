version: '3.8'

services:
  # 1. Next.js App (Lưới CMS + miniCRM + Omnichannel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luoi_app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/luoi/cms/cms.db
      - CMS_DATABASE_URL=file:/app/luoi/cms/cms.db
      - CRM_DATABASE_URL=file:/app/luoi/minicrm/minicrm.db
      - OMNI_DATABASE_URL=file:/app/luoi/omni/omni.db
    volumes:
      - ./prisma:/app/prisma
      - ./luoi:/app/luoi
      - ./public/uploads:/app/public/uploads
    networks:
      - app_net

  # 2. LiteLLM Proxy (Enterprise Production AI Gateway)
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.40.0
    container_name: litellm_proxy
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - app_net

  # 3. OmniRoute (Secondary AI Agent Router & Token Compression)
  omniroute:
    image: node:20-alpine
    container_name: omniroute_engine
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    command: ["node", "-e", "const http = require('http'); const server = http.createServer((req, res) => { res.writeHead(200, {'Content-Type': 'application/json'}); res.end(JSON.stringify({ status: 'online', service: 'OmniRoute Engine', version: '1.0.0', timestamp: new Date().toISOString() })); }); server.listen(8080, '0.0.0.0', () => console.log('OmniRoute Engine listening on 8080'));"]
    networks:
      - app_net

  # 4. OpenClaw (AI Web Scraping & Agent Automation)
  openclaw:
    image: python:3.11-slim
    container_name: openclaw_engine
    restart: always
    ports:
      - "127.0.0.1:7000:7000"
    command: ["python3", "-c", "from http.server import HTTPServer, BaseHTTPRequestHandler; import json;\nclass Handler(BaseHTTPRequestHandler):\n  def do_GET(self):\n    self.send_response(200)\n    self.send_header('Content-Type', 'application/json')\n    self.end_headers()\n    self.wfile.write(json.dumps({'status': 'online', 'service': 'OpenClaw AI Engine', 'version': '1.0.0'}).encode('utf-8'))\nserver = HTTPServer(('0.0.0.0', 7000), Handler)\nprint('OpenClaw listening on 7000')\nserver.serve_forever()"]
    networks:
      - app_net

  # 5. Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
